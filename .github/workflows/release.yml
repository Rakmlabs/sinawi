name: Release

# Push a tag `vX.Y.Z` (see docs/RELEASING.md) → a Developer ID signed, notarized macOS build and a
# published GitHub release with the DMG, the signed updater tarball and latest.json. Installed apps
# pick it up through releases/latest/download/latest.json. A tag with a suffix (`v1.3.0-beta.1`)
# becomes a pre-release, which `latest` skips, so it reaches nobody's updater.
#
# Run the workflow by hand (Actions → Release → Run workflow) for a dry run: the same build, signing
# and notarization, uploaded as a workflow artifact instead of a release.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release that is already published (for example built on a Mac by hand) is final, and without
  # the signing secrets a build would produce an app nobody can install: skip both.
  guard:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      EVENT: ${{ github.event_name }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - id: check
        run: |
          echo "updater key: $HAS_UPDATER_KEY, Developer ID: $HAS_DEVELOPER_ID"
          if [ "$HAS_UPDATER_KEY" != true ] || [ "$HAS_DEVELOPER_ID" != true ]; then
            echo "::warning::Signing secrets are missing (docs/RELEASING.md); not building."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = push ]; then
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
            echo "release $TAG: $draft"
            if [ "$draft" = false ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check version, tag and updater endpoint agree
        run: |
          if [ "$EVENT" = push ]; then node scripts/release.mjs check --tag-name "$TAG" --repo "$GITHUB_REPOSITORY"
          else node scripts/release.mjs check --repo "$GITHUB_REPOSITORY"; fi

      - run: npm test

      # One keychain for the whole job: Tauri signs the app and the native modules, and the DMG is
      # signed afterwards with the same identity.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: App Store Connect API key for notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize and bundle (universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization: an App Store Connect API key, or else an Apple ID with an app password.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/bundle-macos.sh

      - name: Dry run result
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sinawi-release-dry-run
          path: release-assets/
          retention-days: 7

      - name: Release notes (annotated tag message, else GitHub's generated notes)
        if: github.event_name == 'push'
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > notes.md
          fi
          if [ ! -s notes.md ] || [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body > notes.md
          fi
          cat notes.md

      - name: Updater manifest
        if: github.event_name == 'push'
        run: node scripts/latest-json.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --assets release-assets --notes notes.md

      - name: Publish the release
        if: github.event_name == 'push'
        run: |
          VERSION="${TAG#v}"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = false ]; then
            echo "$TAG was published while this ran; leaving its files alone."
          elif [ "$draft" = true ]; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --draft=false "${prerelease[@]}"
          else
            gh release create "$TAG" --verify-tag --title "Sinawi $VERSION" --notes-file notes.md "${prerelease[@]}" release-assets/*
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  refresh-notes:
    # The banner in the app shows latest.json's notes; keep them equal to a release body edited later.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Sync latest.json notes with the release body
        run: |
          gh release download "$TAG" --pattern latest.json --dir manifest
          gh release view "$TAG" --json body --jq .body > notes.md
          jq --rawfile notes notes.md '.notes = ($notes | sub("\\s+$"; ""))' manifest/latest.json > latest.json
          gh release upload "$TAG" latest.json --clobber
