name: Bug report
description: Something in Sinawi does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New chat with Claude as lead, Codex as worker
        2. Send "…"
        3. …
  - type: input
    id: version
    attributes:
      label: Sinawi version
      description: Settings → About, or the release you installed.
    validations:
      required: true
  - type: input
    id: clis
    attributes:
      label: CLIs and versions
      placeholder: "claude 2.1.x, codex 0.16x, grok 1.0.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, keys and private paths before pasting.
