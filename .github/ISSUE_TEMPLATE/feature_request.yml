name: Feature request
description: An idea for Sinawi
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Sinawi do instead?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
